# Local full stack (SRS 2.4). Run from this folder:  docker compose up --build
# Load the demo data once:                             docker compose run --rm core-svc node dist/cli.js seed
#
# web       Next.js frontend in live mode            http://localhost:3000
# gateway   Nginx API gateway                        http://localhost:8080
# core-svc  NestJS API (../../../spa-backend). It serves /api/core/* and, until a separate analytics
#           service exists, /api/ai/* too: the gateway sends both prefixes to it.
# postgres, redis, minio                 infrastructure (MinIO console on http://localhost:9001)

services:
  web:
    build: { context: .., dockerfile: Dockerfile }
    environment:
      NEXT_PUBLIC_API_MODE: live
      API_GATEWAY_INTERNAL_URL: http://gateway:8080
    ports: ["3000:3000"]
    depends_on: [gateway]

  gateway:
    image: nginx:1.27-alpine
    volumes: ["./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:8080"]
    depends_on: [core-svc]

  core-svc:
    build: { context: ../../../spa-backend }
    environment:
      PORT: 3000
      # The API connects as the ordinary role "spa" (see postgres/init.sql): superusers bypass row-level security
      DATABASE_URL: postgres://spa:spa@postgres:5432/spa_platform
      DB_MIGRATIONS_RUN: "true"
      TRUST_PROXY: "true"
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      # Development secrets: replace them for any shared or public deployment
      JWT_SECRET: change-me-jwt-secret-for-local-docker-only
      PII_ENCRYPTION_KEY: bG9jYWwtZG9ja2VyLW9ubHktcGlpLWtleS0zMmJ5dGU=
      MEDIA_SIGNING_SECRET: change-me-media-secret-for-local-docker-only
      # Plain http on localhost: the refresh cookie cannot be Secure
      COOKIE_SECURE: "false"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: spa
      S3_SECRET_KEY: spa-secret-change-me
      S3_BUCKET: spa
      VERIFICATION_CODE_FIXED: "000000"
      SEED_DEMO_PASSWORD: SpaDemo!2026
      # AI features: set ANTHROPIC_API_KEY in your shell before `docker compose up` to enable them
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres-change-me, POSTGRES_DB: spa_platform }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d spa_platform"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: spa, MINIO_ROOT_PASSWORD: spa-secret-change-me }
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  miniodata:
