# SPA API gateway (SRS 2.2.2). The frontend only ever talks to this host.
#   /api/core/*  -> core-svc (NestJS)     services receive the full /api/core/... path (no prefix stripping)
#   /api/ai/*    -> ai-svc (FastAPI)
#   /media/*     -> core-svc, which answers with a 302 to a short-lived MinIO pre-signed URL
# TLS terminates here in production (add a 443 server block with your certificates).

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;          # login, register, verify (NFR-SEC.7)
limit_req_zone $http_authorization zone=per_user:10m rate=30r/s;     # quiz submit, leaderboards

upstream core_svc { server core-svc:3000; keepalive 32; }
upstream ai_svc   { server ai-svc:8000;   keepalive 16; }

map $http_x_trace_id $trace_id {
  default $http_x_trace_id;
  ""      $request_id;   # generate one when the client did not send it (NFR-MAINT.1)
}

server {
  listen 8080;
  server_name _;

  # uploads go straight to MinIO with pre-signed URLs, so API bodies stay small
  client_max_body_size 2m;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 512;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Trace-Id $trace_id;
  add_header X-Trace-Id $trace_id always;

  location = /healthz { return 200 "ok\n"; }

  location ~ ^/api/core/auth/(login|register|verify|oauth) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://core_svc;
  }

  location /api/core/ {
    limit_req zone=per_ip burst=40 nodelay;
    limit_req zone=per_user burst=60 nodelay;
    proxy_pass http://core_svc;
  }

  location /api/ai/ {
    limit_req zone=per_ip burst=20 nodelay;
    proxy_read_timeout 60s;   # report exports can take a while
    proxy_pass http://ai_svc;
  }

  location /media/ {
    proxy_pass http://core_svc;   # core-svc checks access, then 302s to MinIO
  }
}
